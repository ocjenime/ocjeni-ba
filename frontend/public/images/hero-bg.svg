<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Dark base gradient -->
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030305"/>
      <stop offset="50%" stop-color="#05080a"/>
      <stop offset="100%" stop-color="#07100d"/>
    </linearGradient>

    <!-- Green aurora glow -->
    <radialGradient id="aurora1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(52,211,153,0.18)"/>
      <stop offset="40%" stop-color="rgba(34,197,94,0.08)"/>
      <stop offset="100%" stop-color="rgba(52,211,153,0)"/>
    </radialGradient>

    <radialGradient id="aurora2" cx="80%" cy="60%" r="50%">
      <stop offset="0%" stop-color="rgba(20,184,166,0.14)"/>
      <stop offset="50%" stop-color="rgba(34,197,94,0.06)"/>
      <stop offset="100%" stop-color="rgba(20,184,166,0)"/>
    </radialGradient>

    <!-- Subtle grid pattern -->
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    </pattern>

    <!-- Noise filter -->
    <filter id="noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="100%" height="100%" fill="url(#baseGrad)"/>

  <!-- Aurora glows -->
  <ellipse cx="380" cy="300" rx="700" ry="500" fill="url(#aurora1)"/>
  <ellipse cx="1500" cy="650" rx="600" ry="450" fill="url(#aurora2)"/>

  <!-- Grid overlay -->
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Perspective floor lines -->
  <g opacity="0.08" stroke="rgba(52,211,153,0.3)" stroke-width="1">
    <line x1="960" y1="540" x2="-200" y2="1080"/>
    <line x1="960" y1="540" x2="300" y2="1080"/>
    <line x1="960" y1="540" x2="960" y2="1080"/>
    <line x1="960" y1="540" x2="1620" y2="1080"/>
    <line x1="960" y1="540" x2="2120" y2="1080"/>
    <line x1="0" y1="800" x2="1920" y2="800"/>
    <line x1="0" y1="920" x2="1920" y2="920"/>
  </g>

  <!-- City skyline silhouette -->
  <g fill="#020304" opacity="0.85">
    <!-- Left buildings -->
    <rect x="0" y="820" width="120" height="260"/>
    <rect x="110" y="760" width="90" height="320"/>
    <polygon points="110,760 155,700 200,760"/>
    <rect x="210" y="800" width="100" height="280"/>
    <rect x="320" y="740" width="80" height="340"/>
    <polygon points="320,740 360,680 400,740"/>
    <rect x="410" y="830" width="130" height="250"/>

    <!-- Center buildings -->
    <rect x="560" y="720" width="110" height="360"/>
    <polygon points="560,720 615,640 670,720"/>
    <rect x="690" y="780" width="90" height="300"/>
    <rect x="800" y="680" width="140" height="400"/>
    <polygon points="800,680 870,580 940,680"/>
    <rect x="950" y="750" width="100" height="330"/>

    <!-- Right buildings -->
    <rect x="1080" y="700" width="120" height="380"/>
    <polygon points="1080,700 1140,620 1200,700"/>
    <rect x="1220" y="790" width="90" height="290"/>
    <rect x="1330" y="740" width="110" height="340"/>
    <polygon points="1330,740 1385,670 1440,740"/>
    <rect x="1460" y="820" width="100" height="260"/>
    <rect x="1580" y="770" width="130" height="310"/>
    <rect x="1720" y="840" width="110" height="240"/>
    <rect x="1840" y="790" width="80" height="290"/>
  </g>

  <!-- Subtle top vignette -->
  <rect width="100%" height="100%" fill="url(#baseGrad)" opacity="0.3"/>

  <!-- Noise texture -->
  <rect width="100%" height="100%" filter="url(#noise)" opacity="0.4"/>
</svg>
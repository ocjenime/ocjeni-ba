<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Dark base gradient with more depth -->
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030305"/>
      <stop offset="40%" stop-color="#061014"/>
      <stop offset="100%" stop-color="#0a1f1c"/>
    </linearGradient>

    <!-- Stronger green aurora glow -->
    <radialGradient id="aurora1" cx="25%" cy="25%" r="65%">
      <stop offset="0%" stop-color="rgba(52,211,153,0.35)"/>
      <stop offset="35%" stop-color="rgba(34,197,94,0.18)"/>
      <stop offset="70%" stop-color="rgba(20,184,166,0.06)"/>
      <stop offset="100%" stop-color="rgba(52,211,153,0)"/>
    </radialGradient>

    <radialGradient id="aurora2" cx="75%" cy="65%" r="55%">
      <stop offset="0%" stop-color="rgba(20,184,166,0.28)"/>
      <stop offset="45%" stop-color="rgba(34,197,94,0.12)"/>
      <stop offset="100%" stop-color="rgba(20,184,166,0)"/>
    </radialGradient>

    <!-- Bottom green glow -->
    <radialGradient id="bottomGlow" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="rgba(34,197,94,0.20)"/>
      <stop offset="50%" stop-color="rgba(20,184,166,0.08)"/>
      <stop offset="100%" stop-color="rgba(34,197,94,0)"/>
    </radialGradient>

    <!-- Visible grid pattern -->
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(52,211,153,0.08)" stroke-width="1"/>
    </pattern>

    <!-- Noise filter -->
    <filter id="noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.06"/>
      </feComponentTransfer>
    </filter>

    <!-- Window glow filter -->
    <filter id="windowGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="100%" height="100%" fill="url(#baseGrad)"/>

  <!-- Aurora glows -->
  <ellipse cx="420" cy="280" rx="750" ry="550" fill="url(#aurora1)"/>
  <ellipse cx="1450" cy="620" rx="650" ry="500" fill="url(#aurora2)"/>
  <ellipse cx="960" cy="1080" rx="900" ry="500" fill="url(#bottomGlow)"/>

  <!-- Grid overlay -->
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Perspective floor lines -->
  <g opacity="0.18" stroke="rgba(52,211,153,0.45)" stroke-width="1.5">
    <line x1="960" y1="520" x2="-300" y2="1080"/>
    <line x1="960" y1="520" x2="200" y2="1080"/>
    <line x1="960" y1="520" x2="960" y2="1080"/>
    <line x1="960" y1="520" x2="1720" y2="1080"/>
    <line x1="960" y1="520" x2="2220" y2="1080"/>
    <line x1="0" y1="780" x2="1920" y2="780"/>
    <line x1="0" y1="900" x2="1920" y2="900"/>
    <line x1="0" y1="1020" x2="1920" y2="1020"/>
  </g>

  <!-- Stars / particles -->
  <g fill="rgba(255,255,255,0.6)">
    <circle cx="180" cy="150" r="1.5"/>
    <circle cx="340" cy="220" r="1"/>
    <circle cx="520" cy="120" r="1.2"/>
    <circle cx="780" cy="180" r="1"/>
    <circle cx="1100" cy="140" r="1.5"/>
    <circle cx="1280" cy="200" r="1"/>
    <circle cx="1500" cy="160" r="1.3"/>
    <circle cx="1700" cy="240" r="1"/>
    <circle cx="250" cy="320" r="0.8"/>
    <circle cx="1650" cy="110" r="1.2"/>
  </g>

  <!-- City skyline silhouette -->
  <g fill="#050b10" opacity="0.95">
    <!-- Left buildings -->
    <rect x="0" y="800" width="120" height="280"/>
    <rect x="110" y="740" width="90" height="340"/>
    <polygon points="110,740 155,680 200,740"/>
    <rect x="210" y="780" width="100" height="300"/>
    <rect x="320" y="720" width="80" height="360"/>
    <polygon points="320,720 360,660 400,720"/>
    <rect x="410" y="810" width="130" height="270"/>

    <!-- Center buildings -->
    <rect x="560" y="700" width="110" height="380"/>
    <polygon points="560,700 615,620 670,700"/>
    <rect x="690" y="760" width="90" height="320"/>
    <rect x="800" y="660" width="140" height="420"/>
    <polygon points="800,660 870,560 940,660"/>
    <rect x="950" y="730" width="100" height="350"/>

    <!-- Right buildings -->
    <rect x="1080" y="680" width="120" height="400"/>
    <polygon points="1080,680 1140,600 1200,680"/>
    <rect x="1220" y="770" width="90" height="310"/>
    <rect x="1330" y="720" width="110" height="360"/>
    <polygon points="1330,720 1385,650 1440,720"/>
    <rect x="1460" y="800" width="100" height="280"/>
    <rect x="1580" y="750" width="130" height="330"/>
    <rect x="1720" y="820" width="110" height="260"/>
    <rect x="1840" y="770" width="80" height="310"/>
  </g>

  <!-- Building window lights -->
  <g fill="rgba(250,204,21,0.55)" filter="url(#windowGlow)">
    <rect x="30" y="830" width="8" height="12"/>
    <rect x="55" y="860" width="8" height="12"/>
    <rect x="80" y="830" width="8" height="12"/>
    <rect x="130" y="770" width="7" height="10"/>
    <rect x="155" y="800" width="7" height="10"/>
    <rect x="180" y="770" width="7" height="10"/>
    <rect x="230" y="810" width="8" height="12"/>
    <rect x="260" y="840" width="8" height="12"/>
    <rect x="340" y="750" width="7" height="10"/>
    <rect x="365" y="780" width="7" height="10"/>
    <rect x="580" y="730" width="8" height="12"/>
    <rect x="610" y="760" width="8" height="12"/>
    <rect x="640" y="730" width="8" height="12"/>
    <rect x="710" y="790" width="7" height="10"/>
    <rect x="735" y="820" width="7" height="10"/>
    <rect x="820" y="690" width="9" height="14"/>
    <rect x="850" y="720" width="9" height="14"/>
    <rect x="880" y="690" width="9" height="14"/>
    <rect x="910" y="720" width="9" height="14"/>
    <rect x="970" y="760" width="8" height="12"/>
    <rect x="1000" y="790" width="8" height="12"/>
    <rect x="1100" y="710" width="8" height="12"/>
    <rect x="1130" y="740" width="8" height="12"/>
    <rect x="1160" y="710" width="8" height="12"/>
    <rect x="1240" y="800" width="7" height="10"/>
    <rect x="1265" y="830" width="7" height="10"/>
    <rect x="1350" y="750" width="8" height="12"/>
    <rect x="1380" y="780" width="8" height="12"/>
    <rect x="1475" y="830" width="7" height="10"/>
    <rect x="1600" y="780" width="8" height="12"/>
    <rect x="1630" y="810" width="8" height="12"/>
    <rect x="1745" y="850" width="7" height="10"/>
    <rect x="1775" y="880" width="7" height="10"/>
  </g>

  <!-- Top vignette -->
  <rect width="100%" height="100%" fill="url(#baseGrad)" opacity="0.15"/>

  <!-- Noise texture -->
  <rect width="100%" height="100%" filter="url(#noise)" opacity="0.5"/>
</svg>